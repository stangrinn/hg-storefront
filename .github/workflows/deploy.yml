name: Deploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: "Target stage"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.event.inputs.stage || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.stage == 'prod' && 'Production' || 'Development') || (github.ref_name == 'main' && 'Production' || 'Development') }}
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER || 'deploy' }}
      HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
    steps:
      - name: Resolve stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ github.event.inputs.stage }}"

            if [ "${stage}" = "dev" ] && [ "${GITHUB_REF_NAME}" != "dev" ]; then
              echo "Dev deploys must run from the dev branch" >&2
              exit 1
            fi

            if [ "${stage}" = "prod" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "Prod deploys must run from the main branch" >&2
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            stage="dev"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            stage="prod"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "stage=${stage}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bump package version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          messages="$(jq -r '.commits[].message // empty' "$GITHUB_EVENT_PATH")"
          bump="patch"

          if printf '%s\n' "$messages" | grep -Eq 'BREAKING CHANGE|^[[:alpha:]][[:alnum:]_-]*(\([^)]*\))?!:'; then
            bump="major"
          elif printf '%s\n' "$messages" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump="minor"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version "$bump" --no-git-tag-version
          new_version="$(node -p "require('./package.json').version")"

          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: bump version to v${new_version} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Deploy on Hetzner
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.version.outputs.sha || github.sha }}
        run: |
          set -euo pipefail

          test -n "${HETZNER_HOST}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hgart_deploy
          chmod 600 ~/.ssh/hgart_deploy
          ssh-keyscan -p "${HETZNER_PORT}" -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/hgart_deploy \
            -p "${HETZNER_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "sudo /usr/local/bin/hgart-deploy '${{ steps.stage.outputs.stage }}' '${GITHUB_REPOSITORY}' '${DEPLOY_SHA}'"

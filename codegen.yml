overwrite: true
schema: "http://localhost:3000/shop-api"
documents: "./src/app/**/*.graphql.ts"
generates:
  ./src/app/common/generated-types.ts:
    plugins:
      - add:
            content: "// Generated by GraphQL Code Generator. Do not edit manually."
      - "typescript"
      - "typescript-operations"
    config:
      defaultScalarType: unknown
      strictScalars: true
      scalars:
        DateTime: string
        JSON: unknown
        Money: number
        Upload: File
      namingConvention:
        enumValues: 'keep'
      maybeValue: 'T'
      strict: true
  ./src/app/common/introspection-results.ts:
    plugins:
      - add:
            content: "// Generated by GraphQL Code Generator. Do not edit manually."
      - "fragment-matcher"
    config:
        apolloClientVersion: 3

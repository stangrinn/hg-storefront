<ng-template hgartDialogTitle>{{ title }}</ng-template>
<hgart-address-form #addressFormComponent
                  [address]="address"
                  [availableCountries]="availableCountries$ | async"></hgart-address-form>
<ng-template hgartDialogButtons>
    <button type="button"
            class="btn btn-primary"
            [disabled]="addressFormComponent.addressForm.invalid"
            (click)="save(addressFormComponent.addressForm.value)">Okay</button>
</ng-template>

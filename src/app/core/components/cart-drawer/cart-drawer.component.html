<div class="relative z-10" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity ease-in-out duration-500"
         [ngClass]="visible ? 'visible opacity-100' : 'invisible opacity-0'"></div>

    <div class="fixed inset-0 overflow-hidden overlay-container" [ngClass]="visible ? 'visible' : 'invisible'">
        <!-- Make overlay focusable and accessible for keyboard users -->
        <div
            class="absolute inset-0 overflow-hidden"
            (click)="overlayClick($event)"
            (keydown.enter)="overlayClick($event)"
            (keydown.space)="overlayClick($event)"
            tabindex="0"
            aria-label="Close cart drawer"
            #overlay
        >
            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div class="pointer-events-auto w-screen max-w-md transform transition ease-in-out duration-300"
                     [ngClass]="{
                           'translate-x-full': !visible,
                           'translate-x-0': visible
                     }">
                    <div class="flex h-full flex-col overflow-y-scroll bg-white shadow-xl">
                        <div class="flex-1 overflow-y-auto py-6 px-4 sm:px-6">
                            <div class="flex items-start justify-between">
                                <h2 class="text-lg font-medium text-gray-900" id="slide-over-title">Shopping cart</h2>
                                <div class="ml-3 flex h-7 items-center">
                                    <button type="button"
                                            (click)="drawerClosed.emit()"
                                            class="-m-2 p-2 text-gray-400 hover:text-gray-500">
                                        <span class="sr-only">Close panel</span>
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Use strict comparison for async pipe result -->
                            <div *ngIf="(isEmpty$ | async) === false; else empty" class="mt-8">
                                <hgart-cart-contents [cart]="cart$ | async"
                                                   [canAdjustQuantities]="true"
                                                   (setQuantity)="setQuantity($event)"></hgart-cart-contents>
                            </div>

                            <ng-template #empty>
                                <div class="flex items-center justify-center h-48 text-xl text-gray-400">
                                    Your cart is empty
                                </div>
                            </ng-template>
                        </div>

                        <div class="border-t border-gray-200 py-6 px-4 sm:px-6" *ngIf="cart$ | async as cart">
                            <div class="flex justify-between text-base font-medium text-gray-900">
                                <p>Subtotal</p>
                                <p>{{ cart.subTotalWithTax | formatPrice }}</p>
                            </div>
                            <p class="mt-0.5 text-sm text-gray-500">
                                Shipping will be calculated at checkout.
                            </p>
                            <div class="mt-6">
                                <button (click)="drawerClosed.emit()"
                                        [routerLink]="['/checkout']"
                                        class="btn-primary flex w-full">
                                    Checkout
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

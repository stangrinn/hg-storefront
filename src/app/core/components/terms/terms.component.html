<div class="policy">
    <nav class="policy__breadcrumb" aria-label="Breadcrumb">
        <button class="policy__back" type="button" aria-label="Go back" (click)="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 6L9 12L15 18M9 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <a class="policy__crumb" [routerLink]="['/']">Home</a>
        <span class="policy__slash" aria-hidden="true">/</span>
        <span class="policy__crumb policy__crumb--current">Terms &amp; Conditions</span>
    </nav>

    <header class="policy__title">
        <p class="policy__eyebrow">LEGAL AGREEMENTS · HG ART CO.</p>
        <h1>Terms &amp; Conditions</h1>
        <p class="policy__updated">Last Updated: March 20, 2026</p>
        <img class="policy__divider" src="assets/home/flourish.svg" alt="">
    </header>

    <div class="policy__content">
        <section *ngFor="let section of sections; let i = index" class="policy__section" [id]="'section-' + (i + 1)">
            <div class="policy__heading">
                <h2>{{ section.title }}</h2>
                <img src="assets/home/brush-line.svg" alt="">
            </div>
            <p>{{ section.text }}</p>
        </section>
    </div>
</div>

<a *ngIf="product; else placeholder" class="card" prefetch="intent" [routerLink]="['/product', product.slug]">
    <div class="card__mount">
        <div class="card__art">
            <img [src]="currentImage" [alt]="product.productName">
        </div>
    </div>
    <p class="card__title">{{ product.productName }}</p>
</a>

<ng-template #placeholder>
    <div class="card card--placeholder">
        <div class="card__mount"><div class="card__art"></div></div>
    </div>
</ng-template>

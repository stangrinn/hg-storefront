<div class="relative z-10" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 transition-opacity ease-in-out duration-500"
        [ngClass]="visible ? 'visible opacity-100' : 'invisible opacity-0'"></div>

    <div class="fixed inset-0 overflow-hidden overlay-container" [ngClass]="visible ? 'visible' : 'invisible'">
        <div class="absolute inset-0 overflow-hidden" (click)="close()" #overlay>
            <div class="drawer-content">
                <div class="pointer-events-auto w-screen transform transition ease-in-out duration-300" [ngClass]="{
                           '-translate-x-full': !visible,
                           'translate-x-0': visible
                            }">
                    <div class="drawer-content-backdrop">
                        <div class="drawer-content-holder">

                            <div>
                                <div class="drawer-content-title tracking-wider">
                                    Collections
                                    <button class="btn" (click)="close()">
                                        <img width="24" height="24" src="assets/icons/hg-close.svg" alt="Close">
                                    </button>
                                </div>

                                <ul class="drawer-content-list" *ngIf="collectionTree$ | async as tree">

                                    <li *ngFor="let collection of tree.children">
                                        <a 
                                            tabindex="0" (click)="onL0Click($event, collection)"
                                            (keydown)="onL0Keydown($event, collection)">{{ collection.name }}</a>

                                        <ul *ngIf="collection.children.length"
                                            [ngClass]="selected0 === collection.id ? 'block' : 'hidden'">
                                            <li class="level1" *ngFor="let level1 of collection.children">
                                                <a 
                                                    tabindex="0" (click)="onL1Click($event, level1)"
                                                    (keydown)="onL1Keydown($event, level1)">{{ level1.name }}</a>
                                                <ul *ngIf="level1.children.length" class="expandable"
                                                    [class.expanded]="selected1 === level1.id">
                                                    <li class="level2" *ngFor="let level2 of level1.children">
                                                        <a class="" (click)="close()"
                                                            [routerLink]="['/category', level2.slug ]">{{ level2.name
                                                            }}</a>
                                                    </li>
                                                </ul>
                                            </li>
                                        </ul>
                                    </li>
                                </ul>
                            </div>

                            <div class="dashed"></div>

                            <div class="extra-footer"> <!-- Middle column (with left divider) -->
                                <div class="border-l extra-footer-center">
                                    <h3 class="font-semibold tracking-wider uppercase pb-[40px]">
                                        USEFUL LINKS
                                    </h3>
                                    <div>
                                        <div class="pb-[42px]">
                                            <a [routerLink]="['/support']">SUPPORT AND FAQ</a>
                                        </div>
                                        <div class="pb-[42px]">
                                            <a [routerLink]="['/privacy-policy']">PRIVACY POLICY</a>
                                        </div>
                                    </div>
                                </div>

                                <!-- Right column (with left divider) -->
                                <div class="border-l extra-footer-right">
                                    <h3 class="font-semibold  tracking-wider uppercase pb-[40px]">
                                        CONTACT
                                    </h3>

                                    <div>
                                        <div class="pb-[42px]">
                                            <a [routerLink]="['/about']">ABOUT ME</a>
                                        </div>
                                        <div class="pb-[42px]">
                                            <a href="mailto:hello@helenagrinshpun.art"
                                                class="text-base inline-block">HELLO (AT) HELENAGRINSHPUN.ART</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <ng-container *ngIf="collectionsWithProducts$ | async as collections; else loading">
        <ng-container *ngFor="let item of collections">
            <!-- Collection Section -->
            <section class="mb-16 last:mb-0">
                <!-- Collection Title -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl sm:text-4xl font-light tracking-tight text-gray-900 uppercase mb-2">
                        {{ item.collection.name }}
                    </h2>
                    <p class="text-sm text-gray-500 uppercase tracking-wider">
                        Limited to {{ item.products.length }} items · Printed on fine art paper or canvas
                    </p>
                </div>

                <!-- Products Grid -->
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6" *ngIf="item.products.length > 0">
                    <hgart-product-card 
                        *ngFor="let product of item.products" 
                        [product]="product">
                    </hgart-product-card>
                </div>
                
                <!-- Debug: Show if no products -->
                <div *ngIf="item.products.length === 0" class="text-center text-gray-500">
                    No products in this collection yet
                </div>
            </section>
        </ng-container>
    </ng-container>

    <!-- Loading State -->
    <ng-template #loading>
        <section class="mb-16" *ngFor="let _ of [1, 2]">
            <!-- Title Skeleton -->
            <div class="text-center mb-8 animate-pulse">
                <div class="h-10 bg-gray-200 rounded w-64 mx-auto mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-96 mx-auto"></div>
            </div>
            
            <!-- Products Grid Skeleton -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
                <hgart-product-card 
                    *ngFor="let _ of [1, 2, 3, 4]" 
                    [product]="null">
                </hgart-product-card>
            </div>
        </section>
    </ng-template>
</div>

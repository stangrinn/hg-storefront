<div class="gallery">
    <div class="gallery__thumbs" *ngIf="1 < assets?.length">
        <button *ngFor="let asset of assets"
                type="button"
                class="gallery__thumb"
                [class.gallery__thumb--active]="asset.id === selectedAsset?.id"
                (click)="selectImage(asset.id)"
                aria-label="Select asset thumbnail">
            <img [src]="asset | assetPreview:'thumb'" class="select-none" [alt]="asset?.name || 'Asset thumbnail'">
        </button>
    </div>

    <div class="gallery__mount">
        <div class="gallery__art gallery-main-image"
             (mouseenter)="onMouseEnter()"
             (mouseleave)="onMouseLeave()">
            <img *ngIf="selectedAsset"
                 #mainImage
                 [class.gallery-image--lifted]="viewerOpen"
                 [src]="selectedAsset.preview"
                 [alt]="selectedAsset?.name || 'Selected asset'"
                 tabindex="0"
                 (click)="openImage(selectedAsset?.id)"
                 (keyup.enter)="openImage(selectedAsset?.id)"
                 (load)="onLoad()"
                 class="gallery-image"
            />

            <!-- Video overlay for hover effect (only on first image) -->
            <video
                #videoPlayer
                *ngIf="videoSource"
                class="video-overlay"
                [class.visible]="isVideoVisible && isFirstAssetSelected()"
                [src]="videoSource"
                muted
                loop
                playsinline
                preload="metadata"
                [attr.poster]="selectedAsset?.preview">
            </video>

            <!-- Sound toggle: label appears on hover/focus -->
            <button
                *ngIf="isVideoVisible && isFirstAssetSelected()"
                class="volume-button"
                (click)="toggleMute()"
                [attr.aria-label]="isMuted ? 'Turn sound on' : 'Turn sound off'"
                [attr.aria-pressed]="!isMuted"
                type="button">
                <span class="volume-button__label" aria-hidden="true">{{ isMuted ? 'Sound off' : 'Sound on' }}</span>
                <img class="hg-icon volume-button__icon"
                     [src]="isMuted ? 'assets/icons/design-system/sound-off.svg' : 'assets/icons/design-system/sound-on.svg'"
                     alt="">
            </button>
        </div>

        <div *ngIf="!selectedAsset || !featuredAssetLoaded" class="gallery__skeleton"></div>
    </div>
</div>

<hgart-gallery-viewer *ngIf="viewerOpen"
    [items]="viewerItems"
    [index]="viewerIndex"
    [title]="title"
    [year]="year"
    [technique]="technique"
    [size]="size"
    [videoSource]="videoSource"
    [favourite]="favourite"
    [originRect]="originRect"
    (indexChange)="onViewerIndexChange($event)"
    (closed)="onViewerClosed()"></hgart-gallery-viewer>

<div class="gallery">
    <div class="gallery__thumbs" *ngIf="1 < assets?.length">
        <button *ngFor="let asset of assets"
                type="button"
                class="gallery__thumb"
                [class.gallery__thumb--active]="asset.id === selectedAsset?.id"
                (click)="selectImage(asset.id)"
                aria-label="Select asset thumbnail">
            <img [src]="asset | assetPreview:'thumb'" class="select-none" [alt]="asset?.name || 'Asset thumbnail'">
        </button>
    </div>

    <div class="gallery__mount">
        <div class="gallery__art gallery-main-image"
             (mouseenter)="onMouseEnter()"
             (mouseleave)="onMouseLeave()">
            <img *ngIf="selectedAsset"
                 [src]="selectedAsset.preview"
                 [alt]="selectedAsset?.name || 'Selected asset'"
                 tabindex="0"
                 (click)="openImage(selectedAsset?.id)"
                 (keyup.enter)="openImage(selectedAsset?.id)"
                 (load)="onLoad()"
                 class="gallery-image"
            />

            <!-- Video overlay for hover effect (only on first image) -->
            <video
                #videoPlayer
                *ngIf="videoSource"
                class="video-overlay"
                [class.visible]="isVideoVisible && isFirstAssetSelected()"
                [src]="videoSource"
                muted
                loop
                playsinline
                preload="metadata"
                [attr.poster]="selectedAsset?.preview">
            </video>

            <!-- Volume control button -->
            <button
                *ngIf="isVideoVisible && isFirstAssetSelected()"
                class="volume-button"
                (mouseenter)="onVolumeButtonEnter()"
                (mouseleave)="onVolumeButtonLeave()"
                [attr.aria-label]="isMuted ? 'Unmute video' : 'Mute video'"
                type="button">
                <fa-icon [icon]="isMuted ? 'volume-mute' : 'volume-up'"></fa-icon>
            </button>
        </div>

        <div *ngIf="!selectedAsset || !featuredAssetLoaded" class="gallery__skeleton"></div>
    </div>
</div>

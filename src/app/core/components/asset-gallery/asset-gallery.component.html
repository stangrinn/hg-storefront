<div class="gallery-main-image"
     (mouseenter)="onMouseEnter()"
     (mouseleave)="onMouseLeave()">
    <img *ngIf="selectedAsset" 
         [src]="selectedAsset.preview" 
         [alt]="selectedAsset?.name || 'Selected asset'"
         tabindex="0"
         (click)="openImage(selectedAsset?.id)"
         (keyup.enter)="openImage(selectedAsset?.id)"
         (load)="onLoad()"
         class="w-full h-full object-center object-cover cursor-pointer gallery-image"
    />
    
    <!-- Video overlay for hover effect (only on first image) -->
    <video 
        #videoPlayer
        *ngIf="videoSource"
        class="video-overlay"
        [class.visible]="isVideoVisible && isFirstAssetSelected()"
        [src]="videoSource"
        muted
        loop
        playsinline
        preload="metadata"
        [attr.poster]="selectedAsset?.preview">
    </video>
</div>

<div *ngIf="!selectedAsset || !featuredAssetLoaded"
     class="rounded-lg bg-gray-200 animate-pulse aspect-video w-full"></div>

<div class="flex flex-wrap space-x-2 mt-2" *ngIf="1 < assets?.length">
    <div *ngFor="let asset of assets"
         (click)="selectImage(asset.id)"
         (keyup.enter)="selectImage(asset.id)"
         tabindex="0"
         role="button"
         aria-label="Select asset thumbnail">
        <img [src]="asset | assetPreview:'thumb'" class="select-none h-24 w-full object-cover" [alt]="asset?.name || 'Asset thumbnail'">
    </div>
</div>

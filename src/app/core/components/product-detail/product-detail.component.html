<div class="product-detail-wrapper">
    <div class="product-detail-container">

        <div class="product-grid">
            <div class="product-nav product-nav-prev" (click)="nextOrPreviousProduct(false)"></div>

            <div class="product-main-content">
                <hgart-asset-gallery [assets]="product?.assets" [selectedAssetId]="product?.featuredAsset?.id" />

                <div class="product-info">

                    <div class="product-header">

                        <div class="product-header__content">
                            <div class="product-header__titles">
                                <h2 class="product-title">
                                    {{ product?.name ?? ' ' }}
                                </h2>

                                <div *ngIf="product?.customFields?.artCollectionName" class="product-collection-name">
                                    {{ product?.customFields?.artCollectionName }} collection
                                </div>
                            </div>


                            <button type="submit" class="preorder-btn" [ngClass]="{
                                    'preorder-btn--disabled': inFlight,
                                    'preorder-btn--active': !inFlight
                                }">
                                <div *ngIf="!product || !qtyInCart[selectedVariant.id]; else inCartCount">PREORDER
                                </div>

                                <ng-template #inCartCount>
                                    <fa-icon icon="check" class="preorder-btn__icon"></fa-icon>
                                    <span>{{ qtyInCart[selectedVariant.id] }} in cart</span>
                                </ng-template>

                            </button>
                        </div>
                    </div>

                    <div class="variant-selector" *ngIf="product?.variants.length > 1">
                        <label htmlFor="option" class="variant-selector__label">
                            Select option
                        </label>
                        <select [(ngModel)]="selectedVariant" class="variant-selector__select">
                            <option *ngFor="let variant of product?.variants" [ngValue]="variant">{{ variant.name }}
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <div class="product-close" (click)="closeProductDetails()"></div>
                <div (click)="nextOrPreviousProduct(true)" class="product-nav product-nav-next"></div>
            </div>

        </div>

    </div>

    <div class="tabs">
        <!-- Tabs Navigation -->
        <div class="tabs__nav">
            <nav class="tabs__nav-list">
                <button type="button" (click)="setActiveTab('description')" class="tabs__tab" [ngClass]="{
                        'tabs__tab--active': activeTab === 'description',
                        'tabs__tab--inactive': activeTab !== 'description'
                    }">
                    Description
                </button>
                <button *ngIf="hasAdditionalInfo()" type="button" (click)="setActiveTab('additionalInfo')"
                    class="tabs__tab" [ngClass]="{
                        'tabs__tab--active': activeTab === 'additionalInfo',
                        'tabs__tab--inactive': activeTab !== 'additionalInfo'
                    }">
                    Additional Information
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div class="tabs__content">
            <!-- Description Tab -->
            <div *ngIf="activeTab === 'description'" class="tabs__panel">
                <h3 class="tabs__panel-title">Description</h3>
                <div class="tabs__panel-content" [innerHTML]="product?.description | safeHtml"></div>
            </div>

            <!-- Additional Information Tab -->
            <div *ngIf="activeTab === 'additionalInfo' && hasAdditionalInfo()" class="tabs__panel">
                <h3 class="tabs__panel-title">Additional Information</h3>
                <div class="tabs__panel-content" [innerHTML]="getAdditionalInfo() | safeHtml"></div>
            </div>
        </div>
    </div>
</div>

<ng-template #addedToCartTemplate let-variant="variant" let-quantity="quantity" let-close="closeFn">
    <div class="cart-notification">
        <div class="cart-notification__image-wrapper">
            <img class="cart-notification__image"
                [src]="(variant.featuredAsset?.preview || product?.featuredAsset?.preview) + '?preset=tiny'"
                alt="product thumbnail" />
        </div>
        <div class="cart-notification__text">{{ quantity }} x {{ variant.name }}</div>
    </div>
    <div class="cart-notification__actions">
        <button type="button" (click)="viewCartFromNotification(close)" class="cart-notification__view-cart-btn">
            View cart
        </button>
    </div>
</ng-template>

<div class="mx-auto px-4">
    <ng-container *ngIf="collection$ | async as collection">
        <div class="flex justify-center items-center flex-col">
            <h2 class="text-3xl sm:text-5xl font-light tracking-tight text-gray-900 my-8">
                {{collection.name}}
            </h2>
            <p *ngIf="collection.description" class="prod-desc" [innerHTML]="collection.description">
            </p>
        </div>
        <!-- <hgart-collection-breadcrumbs [breadcrumbs]="breadcrumbs$ | async"></hgart-collection-breadcrumbs> -->
        <ng-container *ngIf="collection.children.length">
            <div class="max-w-2xl mx-auto py-16 sm:py-16 lg:max-w-none border-b mb-16">
                <h2 class="text-2xl font-light text-gray-900">
                    Collections
                </h2>
                <div class="mt-6 grid max-w-xs sm:max-w-none mx-auto sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-4">
                    <hgart-collection-card *ngFor="let child of collection.children" [collection]="child">
                    </hgart-collection-card>
                </div>
            </div>
        </ng-container>
    </ng-container>

    <h2 class="text-3xl sm:text-5xl font-light tracking-tight text-gray-900 my-8" *ngIf="searchTerm$ | async as term">
        Results for <span class="font-medium">"{{ term }}"</span>
    </h2>

    <div>
        <div class="flex flex-wrap justify-center gap-y-10 gap-x-6">
            <ng-container *ngIf="(totalResults$ | async) !== null; else placeholders">

                <hgart-product-card *ngFor="let product of products$ | async; trackBy: trackByProductId"
                    [product]="product"
                    class="w-full sm:w-[calc(50%-0.75rem)] lg:w-[calc(15%-1.125rem)] max-w-xs"></hgart-product-card>

            </ng-container>

            <ng-template #placeholders>
                <hgart-product-card *ngFor="let product of placeholderProducts" [product]="product"
                    class="w-full sm:w-[calc(50%-0.75rem)] lg:w-[calc(25%-1.125rem)] max-w-xs"></hgart-product-card>
            </ng-template>
        </div>

        <div class="load-more flex-fill" *ngIf="displayLoadMore$ | async">
            <button class="btn btn-light btn-lg d-inline-flex align-items-center" (click)="loadMore()"
                [disabled]="loading$ | async">
                Load more
                <span [class.show]="loading$ | async" class="loading-indicator spinner-grow spinner-grow-sm"
                    role="status" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <ng-template #noResults>
        <div class="no-results col-12">
            <p class="h1">No results</p>
            <fa-icon icon="sad-cry" size="10x"></fa-icon>
        </div>
    </ng-template>
</div>

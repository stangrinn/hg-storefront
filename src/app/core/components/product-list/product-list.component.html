<div class="collection">
    <ng-container *ngIf="collection$ | async as collection">
        <nav class="collection__breadcrumb" aria-label="Breadcrumb">
            <button class="collection__back" type="button" aria-label="Go back" (click)="goBack()">
                <img src="assets/collection/back.svg" alt="">
            </button>
            <a class="collection__crumb" [routerLink]="['/']">Home</a>
            <span class="collection__slash" aria-hidden="true">/</span>
            <span class="collection__crumb collection__crumb--current">{{ collection.name }}</span>
        </nav>

        <header class="collection__intro">
            <p class="collection__eyebrow">
                HG ART · DIGITAL EDITIONS 01—{{ pad(totalResults$ | async) }}
            </p>
            <img class="collection__ornament" src="assets/collection/ornament.svg" alt="">
            <h1 class="collection__title">{{ collection.name }}<span *ngIf="!collection.name.toLowerCase().endsWith('collection')">Collection</span></h1>
            <div *ngIf="collection.description" class="collection__description" [innerHTML]="collection.description"></div>
            <img class="collection__divider" src="assets/collection/divider.svg" alt="">
        </header>

        <ng-container *ngIf="collection.children.length">
            <div class="collection__children">
                <div class="collection__children-grid">
                    <hgart-collection-card *ngFor="let child of collection.children" [collection]="child">
                    </hgart-collection-card>
                </div>
            </div>
        </ng-container>

        <div class="collection__toolbar">
            <p>{{ pad(totalResults$ | async) }} ARTWORKS</p>
        </div>
    </ng-container>

    <h2 class="collection__search" *ngIf="searchTerm$ | async as term">
        Results for <span>"{{ term }}"</span>
    </h2>

    <div>
        <div class="collection__grid">
            <ng-container *ngIf="(totalResults$ | async) !== null; else placeholders">

                <hgart-product-card *ngFor="let product of products$ | async; trackBy: trackByProductId"
                    [product]="product"
                    ></hgart-product-card>

            </ng-container>

            <ng-template #placeholders>
                <hgart-product-card *ngFor="let product of placeholderProducts" [product]="product"></hgart-product-card>
            </ng-template>
        </div>

        <div class="load-more flex-fill" *ngIf="displayLoadMore$ | async">
            <button class="btn btn-light btn-lg d-inline-flex align-items-center" (click)="loadMore()"
                [disabled]="loading$ | async">
                Load more
                <span [class.show]="loading$ | async" class="loading-indicator spinner-grow spinner-grow-sm"
                    role="status" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <ng-template #noResults>
        <div class="no-results col-12">
            <p class="h1">No results</p>
            <fa-icon icon="sad-cry" size="10x"></fa-icon>
        </div>
    </ng-template>
</div>

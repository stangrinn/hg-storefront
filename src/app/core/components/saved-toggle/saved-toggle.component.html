<button class="saved-toggle" type="button" aria-label="Saved artworks" (click)="opened.emit()">
    <picture><source *ngIf="collectionStyle" media="(min-width: 1024px)" srcset="assets/header/saved-mobile.svg"><source media="(min-width: 1024px) and (max-width: 1919px)" srcset="assets/header/saved-desktop.svg"><img alt="" src="assets/header/saved-mobile.svg"></picture>
    <span class="saved-toggle__badge" *ngIf="count as savedCount">{{ savedCount }}</span>
</button>

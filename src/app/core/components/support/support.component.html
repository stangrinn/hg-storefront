<div class="faq">
    <nav class="faq__breadcrumb" aria-label="Breadcrumb">
        <button class="faq__back" type="button" aria-label="Go back" (click)="goBack()">
            <img class="hg-icon" src="assets/icons/design-system/back.svg" alt="">
        </button>
        <a class="faq__crumb" [routerLink]="['/']">Home</a>
        <span class="faq__slash" aria-hidden="true">/</span>
        <span class="faq__crumb faq__crumb--current">FAQ</span>
    </nav>

    <div class="faq__content">
        <header class="faq__intro">
            <h1>Frequently asked questions</h1>
            <img src="assets/home/brush-line.svg" alt="">
            <p>Everything to know about collecting, delivery and bringing your artwork to life through augmented reality.</p>
        </header>

        <div class="faq__list">
            <div *ngFor="let item of items; let i = index" class="faq__item" [class.faq__item--open]="isOpen(i)">
                <button type="button" class="faq__question" [attr.aria-expanded]="isOpen(i)" (click)="toggleQuestion(i)">
                    <span>{{ item.question }}</span>
                    <img class="faq__chevron hg-icon" src="assets/icons/design-system/disclosure.svg" width="24" height="24" alt="">
                </button>
                <div class="faq__answer">
                    <p *ngFor="let line of item.answer">{{ line }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

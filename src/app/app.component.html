<vsf-layout>
    <vsf-layout-header>
        <div class="content-holder">

            <vsf-mobile-menu-toggle class="md:hidden"></vsf-mobile-menu-toggle>

            <div class="content-holder-centered">
                <vsf-collections-menu class="hidden md:block "></vsf-collections-menu>

                <a [routerLink]="['/about-me']" class="l">About me</a>
            </div>

            <div class="w-[250px]">
                <a [routerLink]="['/']" class="absolute bottom-[6px]">
                    <img alt="Helena Grinshpun ARt" class="w-[280px]" src="assets/logo.png">
                </a>
            </div>

            <div class="content-holder-centered">
                <vsf-cart-toggle (toggle)="openCartDrawer()"></vsf-cart-toggle>

                <vsf-account-link class=""></vsf-account-link>
            </div>
        </div>
    </vsf-layout-header>

    <vsf-collections-menu-mobile [visible]="mobileNavVisible$ | async" class="z-10"></vsf-collections-menu-mobile>

    <vsf-cart-drawer (close)="closeCartDrawer()" [visible]="cartDrawerVisible$ | async"></vsf-cart-drawer>

    <vsf-home-page *ngIf="isHomePage$ | async; else main" style="flex: 1;"></vsf-home-page>

    <ng-template #main>
        <div style="flex: 1;">
            <router-outlet></router-outlet>
        </div>
    </ng-template>

    <vsf-layout-footer>
        <footer aria-labelledby="footer-heading" class="border-t">
            <h2 class="sr-only" id="footer-heading">Footer</h2>
            <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:py-16 lg:px-8 ">
                <div class="xl:grid xl:grid-cols-3 xl:gap-8">
                    <div class="grid grid-cols-2 gap-8 xl:col-span-2">
                        <div class="md:grid md:grid-cols-2 md:gap-8">
                            <div>
                                <h3 class="text-sm font-semibold text-gray-500 tracking-wider uppercase">
                                    HELENA GRINSHPUN ART
                                </h3>
                                <ul class="mt-4 space-y-4" role="list">
                                    <li *ngFor="let item of topCollections$ | async">
                                        <a [routerLink]="['/category', item.slug]"
                                            class="text-base text-gray-500 hover:text-gray-600">
                                            {{item.name}}
                                        </a>
                                    </li>
                                </ul>
                            </div>
                            <div class="mt-12 md:mt-0">
                                <h3 class="text-sm font-semibold text-gray-500 tracking-wider uppercase">
                                    USEFUL LINKS
                                </h3>
                                <ul class="mt-4 space-y-4" role="list">
                                    <li *ngFor="let item of navigation.support">
                                        <a [href]="item.href" class="text-base text-gray-500 hover:text-gray-600">
                                            {{item.name}}
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="md:grid md:grid-cols-2 md:gap-8">
                            <div>
                                <h3 class="text-sm font-semibold text-gray-500 tracking-wider uppercase">
                                    CONTACT
                                </h3>
                                <ul class="mt-4 space-y-4" role="list">
                                    <li *ngFor="let item of navigation.company">
                                        <a [href]="item.href" class="text-base text-gray-500 hover:text-gray-600">
                                            {{item.name}}
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </footer>
    </vsf-layout-footer>

</vsf-layout>
